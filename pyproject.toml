[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptlsh"
version = "0.4.0"
description = "Fingerprint for prompt attacks: a similarity digest (fuzzy hash) for correlating reworded adversarial prompts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ashwinvis98", email = "ashwinvis98@gmail.com" }]
keywords = ["minhash", "simhash", "fuzzy-hash", "similarity", "prompt-injection", "jailbreak", "threat-intelligence", "correlation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2"]
fastembed = ["fastembed>=0.3"]
onnx = ["onnxruntime>=1.16", "tokenizers>=0.15", "huggingface_hub>=0.20", "numpy>=1.21"]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/ashwinvis98/promptlsh"
Repository = "https://github.com/ashwinvis98/promptlsh"

[project.scripts]
promptlsh = "promptlsh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # line length is owned by the formatter, not the linter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

